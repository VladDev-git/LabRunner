global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: lab5

# Pull model: Prometheus scrapes every target inside monitoring-net.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: labrunner-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]

  - job_name: labrunner-orchestrator
    metrics_path: /metrics
    static_configs:
      - targets: ["orchestrator:8081"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
