# LabRunner — production stack on the VM (lab 5).
# Deployed by the CD job (.github/workflows/ci.yml -> deploy/scripts/deploy.sh).
# Application images come from GHCR by an immutable tag: IMAGE_TAG=sha-<commit>.

name: labrunner

# Log rotation for every container: at most 3 x 10 MB of logs per service.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-env: &backend-env
  DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  S3_ENDPOINT: http://storage:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET}

services:
  # ---------- Edge ----------
  proxy:
    image: caddy:2.11.9-alpine
    container_name: labrunner-proxy
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [public-net, backend-net]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging: *logging
    restart: unless-stopped

  # ---------- Application ----------
  api:
    image: ghcr.io/vladdev-git/labrunner-api:${IMAGE_TAG}
    container_name: labrunner-api
    environment:
      <<: *backend-env
      PORT: "8080"
      APP_VERSION: ${IMAGE_TAG}
    networks: [backend-net, monitoring-net]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6
    stop_grace_period: 20s
    logging: *logging
    restart: unless-stopped

  orchestrator:
    image: ghcr.io/vladdev-git/labrunner-orchestrator:${IMAGE_TAG}
    container_name: labrunner-orchestrator
    environment:
      <<: *backend-env
      HEALTH_PORT: "8081"
    networks: [backend-net, monitoring-net]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6
    stop_grace_period: 30s
    logging: *logging
    restart: unless-stopped

  # ---------- Backing services ----------
  db:
    image: postgres:16-alpine
    container_name: labrunner-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [backend-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: labrunner-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks: [backend-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging
    restart: unless-stopped

  storage:
    image: rustfs/rustfs:1.0.7
    container_name: labrunner-storage
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - storage_data:/data
    networks: [backend-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging
    restart: unless-stopped

  # ---------- Observability ----------
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: labrunner-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [monitoring-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready | grep -q Ready"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging: *logging
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.13.1
    container_name: labrunner-node-exporter
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [monitoring-net]
    logging: *logging
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.61.1
    container_name: labrunner-cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
    networks: [monitoring-net]
    logging: *logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.7
    container_name: labrunner-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Read-only anonymous access, used only in the isolated lab network (see ADR-0007).
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_VIEWER:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    # public-net: the reverse proxy reaches Grafana and Grafana reaches the Telegram API.
    networks: [public-net, monitoring-net]
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging: *logging
    restart: unless-stopped

networks:
  public-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true
  monitoring-net:
    driver: bridge
    internal: true

volumes:
  pg_data:
  redis_data:
  storage_data:
  prometheus_data:
  grafana_data:
  caddy_data:
