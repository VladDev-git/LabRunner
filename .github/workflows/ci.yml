# LabRunner CI/CD: quality gates for every Pull Request into main,
# immutable images in GHCR for every commit on main and every SemVer tag,
# automatic deployment of main to the VM with a post-deploy smoke test.
name: LabRunner CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

# A new push to the same PR cancels the outdated run; runs on main are never
# cancelled half-way (they deploy).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: "21"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/vladdev-git/labrunner

jobs:
  # ---------- Stage 1: static quality checks (fail fast) ----------
  lint:
    name: Lint (ktlint, Android Lint, Hadolint)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: ktlint (all Kotlin modules) and Android Lint
        run: ./gradlew ktlintCheck :composeApp:lintDebug --continue
      - name: Hadolint — server/api/Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: server/api/Dockerfile
          failure-threshold: warning
      - name: Hadolint — server/orchestrator/Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: server/orchestrator/Dockerfile
          failure-threshold: warning
      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-reports
          path: "**/build/reports/"

  # ---------- Stage 1b: Infrastructure as Code (offline checks, no cloud access) ----------
  iac:
    name: IaC validate (Terraform, Ansible)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.2"
      # Both targets are validated: kvm (applied in lab 4) and azure (ready for a subscription).
      - name: terraform fmt / init / validate
        working-directory: infra/terraform
        run: |
          terraform fmt -recursive -check -diff
          for dir in kvm azure; do
            echo "::group::terraform validate ($dir)"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: ansible-lint (production profile)
        working-directory: infra/ansible
        run: |
          pip install --quiet ansible-lint
          ansible-galaxy collection install -r requirements.yml
          ansible-playbook -i localhost, --syntax-check playbook.yml
          ansible-lint --profile production playbook.yml

  # ---------- Stage 2: automated tests ----------
  test:
    name: Tests (server, contracts, Android)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Unit tests + integration tests with Testcontainers (PostgreSQL 16 in Docker).
      - name: Server and shared contracts tests
        run: ./gradlew :shared:contracts:jvmTest :server:api:test :server:orchestrator:test
      - name: Android unit tests and debug APK
        run: ./gradlew :composeApp:testDebugUnitTest :composeApp:assembleDebug
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: "**/build/reports/tests/"
      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: labrunner-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          retention-days: 14

  ios:
    name: iOS build and tests (Kotlin/Native)
    needs: lint
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Shared code tests on the iOS simulator + the framework that Xcode links.
      - name: Tests on iOS simulator and iOS framework
        run: ./gradlew :shared:contracts:iosSimulatorArm64Test :composeApp:iosSimulatorArm64Test :composeApp:linkDebugFrameworkIosSimulatorArm64

  # ---------- Stage 3: DevSecOps — dependencies, configs, secrets ----------
  security-fs:
    name: Security scan (dependencies & configs)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # gradle.lockfile files make the Gradle runtime dependencies visible to Trivy.
      - name: Trivy filesystem scan (vulnerabilities, misconfigurations, secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy SARIF report for GitHub code scanning
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy-fs.sarif
          skip-setup-trivy: true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ---------- Stage 4: build once, scan the image, publish on main ----------
  image:
    name: Build, scan & push (${{ matrix.service }})
    needs: [test, security-fs]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, orchestrator]
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Immutable tags: sha-<short commit> always, SemVer for release tags. No :latest.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          # By default metadata-action also adds :latest to SemVer tags (latest=auto).
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=labrunner-${{ matrix.service }}

      - name: Build image (loaded locally for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/${{ matrix.service }}/Dockerfile
          load: true
          tags: labrunner-${{ matrix.service }}:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy image scan (quality gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: labrunner-${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same build inputs + warm cache: the pushed image is the one that was scanned.
      - name: Push to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}

  # ---------- Stage 5: Continuous Deployment to the VM ----------
  # Only for commits on main, only after every quality gate and image publication.
  # Runs on the self-hosted runner inside the VM (installed by Ansible, ADR-0007):
  # the VM is in an isolated network that GitHub-hosted runners cannot reach.
  deploy:
    name: Deploy to LabRunner VM & smoke test
    needs: [image, ios, iac]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, labrunner-vm]
    timeout-minutes: 15
    environment:
      name: production
      url: http://10.40.1.10/
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy
      - name: Deploy immutable images sha-<commit> and run smoke test
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GRAFANA_ANONYMOUS_VIEWER: ${{ vars.GRAFANA_ANONYMOUS_VIEWER }}
        run: |
          export IMAGE_TAG="sha-${GITHUB_SHA::7}"
          bash deploy/scripts/deploy.sh
