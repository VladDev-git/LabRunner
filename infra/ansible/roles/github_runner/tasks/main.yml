---
# Self-hosted GitHub Actions runner used only by the "deploy" job (ADR-0007).
- name: Create runner directory
  ansible.builtin.file:
    path: "{{ github_runner_dir }}"
    state: directory
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    mode: "0750"

- name: Download the runner (checksum verified)
  ansible.builtin.get_url:
    url: "https://github.com/actions/runner/releases/download/v{{ github_runner_version }}/actions-runner-linux-x64-{{ github_runner_version }}.tar.gz"
    dest: "{{ github_runner_dir }}/actions-runner-{{ github_runner_version }}.tar.gz"
    checksum: "sha256:{{ github_runner_sha256 }}"
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    mode: "0640"

- name: Unpack the runner
  ansible.builtin.unarchive:
    src: "{{ github_runner_dir }}/actions-runner-{{ github_runner_version }}.tar.gz"
    dest: "{{ github_runner_dir }}"
    remote_src: true
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    creates: "{{ github_runner_dir }}/config.sh"

- name: Install runner OS dependencies
  ansible.builtin.command:
    cmd: ./bin/installdependencies.sh
    chdir: "{{ github_runner_dir }}"
    creates: /usr/share/doc/libicu74

- name: Check whether the runner is already registered
  ansible.builtin.stat:
    path: "{{ github_runner_dir }}/.runner"
  register: github_runner_registered

- name: A registration token is required for the first registration
  ansible.builtin.assert:
    that: github_runner_token | length > 0
    fail_msg: "Pass -e github_runner_token=... (gh api -X POST repos/OWNER/REPO/actions/runners/registration-token)"
  when: not github_runner_registered.stat.exists

- name: Register the runner in the repository
  ansible.builtin.command:
    cmd: >-
      ./config.sh --unattended --replace
      --url {{ github_runner_repo_url }}
      --token {{ github_runner_token }}
      --name {{ github_runner_name }}
      --labels {{ github_runner_labels }}
      --work _work
    chdir: "{{ github_runner_dir }}"
    creates: "{{ github_runner_dir }}/.runner"
  become: true
  become_user: "{{ github_runner_user }}"
  no_log: true

- name: Install the runner as a systemd service
  ansible.builtin.command:
    cmd: ./svc.sh install {{ github_runner_user }}
    chdir: "{{ github_runner_dir }}"
    creates: "{{ github_runner_dir }}/.service"

- name: Read the service name
  ansible.builtin.slurp:
    src: "{{ github_runner_dir }}/.service"
  register: github_runner_service

- name: Runner service is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ github_runner_service.content | b64decode | trim }}"
    state: started
    enabled: true
