---
- name: Update apt cache (valid for 1 hour)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Apply security and system updates
  ansible.builtin.apt:
    upgrade: safe
  register: common_upgrade

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - htop
      - jq
      - ufw
      - fail2ban
      - unattended-upgrades
    state: present

- name: Set timezone to Europe/Kyiv
  community.general.timezone:
    name: Europe/Kyiv

- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"
